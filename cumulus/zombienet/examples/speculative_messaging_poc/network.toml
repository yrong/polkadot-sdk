# Speculative messaging POC — two Penpal parachains on Rococo-local.
#
# Para 2000 = SENDER  — produces outbound XCM via pallet-speculative-outbox.
# Para 2001 = RECEIVER — fetches batches from the sender over JSON-RPC and
#                        includes them via pallet-speculative-inbox.
#
# Build before running:
#   cargo build -p polkadot --release
#   cargo build -p polkadot-parachain --release
#
# Run with zombienet (native provider):
#   zombienet --provider native spawn cumulus/zombienet/examples/speculative_messaging_poc/network.toml
#
# The sender's RPC port is pinned to 9955 so the receiver can reference it
# at a known address via --speculative-sender.

[relaychain]
default_command = "{{POLKADOT_BINARY}}"
default_args = ["-lparachain=debug,runtime=debug,runtime::inclusion=debug", "--pruning=archive"]
chain = "rococo-local"

[[relaychain.nodes]]
name = "alice"
validator = true
rpc_port = 9900
ws_port = 9901
balance = 2000000000000000000000

[[relaychain.nodes]]
name = "bob"
validator = true

[[relaychain.nodes]]
name = "charlie"
validator = true

[[relaychain.nodes]]
name = "dave"
validator = true

# ── Para 2000: Sender ─────────────────────────────────────────────────────────

[[parachains]]
id = 2000
chain = "penpal-rococo-local"
cumulus_based = true

[[parachains.collators]]
name = "sender"
validator = true
command = "{{POLKADOT_PARACHAIN_BINARY}}"
rpc_port = 9955
args = [
	"--authoring=slot-based",
	"-lparachain=debug,cumulus-collator=debug,speculative::outbox=debug,aura::cumulus=debug",
	"--pruning=archive",
]

[[parachains]]
id = 2001
chain = "penpal-rococo-local"
cumulus_based = true

[[parachains.collators]]
name = "receiver"
validator = true
command = "{{POLKADOT_PARACHAIN_BINARY}}"
rpc_port = 9966
args = [
	"--authoring=slot-based",
	# Pull speculative batches from the sender via its JSON-RPC endpoint.
	"--speculative-sender=2000=ws://127.0.0.1:9955",
	"-lparachain=debug,cumulus-collator=debug,speculative::inbox=debug,aura::cumulus=debug",
	"--pruning=archive",
]
