[package]
name = "cumulus-pallet-speculative-inbox"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
description = "Pallet for receiving and verifying speculative messages on the destination parachain."
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
codec = { features = ["derive"], workspace = true }
log = { workspace = true }
scale-info = { features = ["derive"], workspace = true }

# Substrate
frame-support = { workspace = true }
frame-system = { workspace = true }
sp-core = { workspace = true }
sp-inherents = { workspace = true }
sp-runtime = { workspace = true }

# Merkle / MMR
binary-merkle-tree = { workspace = true }
mmr-lib = { workspace = true }
sp-mmr-primitives = { workspace = true }

# Polkadot
polkadot-parachain-primitives = { workspace = true }
polkadot-primitives = { workspace = true }

# Cumulus
cumulus-primitives-core = { workspace = true }

# Node-only (client module)
sp-api = { workspace = true, optional = true }

[dev-dependencies]
cumulus-pallet-speculative-outbox = { workspace = true, default-features = true }
cumulus-pallet-parachain-system = { workspace = true, default-features = true }
pallet-balances = { workspace = true, default-features = true }
sp-io = { workspace = true, default-features = true }

[features]
default = ["std"]
std = [
	"binary-merkle-tree/std",
	"codec/std",
	"cumulus-primitives-core/std",
	"frame-support/std",
	"frame-system/std",
	"log/std",
	"mmr-lib/std",
	"polkadot-parachain-primitives/std",
	"polkadot-primitives/std",
	"scale-info/std",
	"sp-api",
	"sp-api/std",
	"sp-core/std",
	"sp-inherents/std",
	"sp-mmr-primitives/std",
	"sp-runtime/std",
]
runtime-benchmarks = [
	"cumulus-pallet-parachain-system/runtime-benchmarks",
	"cumulus-primitives-core/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"polkadot-parachain-primitives/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
]
try-runtime = [
	"cumulus-pallet-parachain-system/try-runtime",
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"sp-runtime/try-runtime",
]
