[package]
name = "cumulus-pallet-xcmp-mmd-outbox"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "XCMP MMD outbox pallet - commits outbound messages to an MMR and deposits digest"

[lints]
workspace = true

[dependencies]
codec = { features = ["derive"], workspace = true }
scale-info = { features = ["derive"], workspace = true }
log = { workspace = true }

# Substrate
frame-support = { workspace = true }
frame-system = { workspace = true }
sp-core = { workspace = true }
sp-io = { workspace = true }
sp-runtime = { workspace = true }
sp-std = { workspace = true }

# MMR primitives
sp-mmr-primitives = { workspace = true }
mmr-lib = { workspace = true }

# Polkadot
polkadot-parachain-primitives = { workspace = true }

# Cumulus
cumulus-primitives-core = { workspace = true }
cumulus-primitives-xcmp-mmd = { workspace = true }

[dev-dependencies]
sp-io = { workspace = true, default-features = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"cumulus-primitives-core/std",
	"cumulus-primitives-xcmp-mmd/std",
	"frame-support/std",
	"frame-system/std",
	"log/std",
	"mmr-lib/std",
	"polkadot-parachain-primitives/std",
	"scale-info/std",
	"sp-core/std",
	"sp-io/std",
	"sp-mmr-primitives/std",
	"sp-runtime/std",
	"sp-std/std",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
]
