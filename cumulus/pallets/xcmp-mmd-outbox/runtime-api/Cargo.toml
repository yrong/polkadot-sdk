[package]
name = "cumulus-pallet-xcmp-mmd-outbox-runtime-api"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "Runtime API for XCMP MMD outbox proof generation"

[lints]
workspace = true

[dependencies]
codec = { features = ["derive"], workspace = true }
scale-info = { features = ["derive"], workspace = true }

# Substrate
sp-api = { workspace = true }
sp-core = { workspace = true }

# Cumulus
cumulus-primitives-xcmp-mmd = { workspace = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"cumulus-primitives-xcmp-mmd/std",
	"scale-info/std",
	"sp-api/std",
	"sp-core/std",
]
