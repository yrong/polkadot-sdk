[package]
name = "cumulus-pallet-xcmp-mmd-inbox"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "XCMP MMD inbox pallet for receiving and verifying cross-chain messages"
repository.workspace = true

[lints]
workspace = true

[dependencies]
codec = { workspace = true }
log = { workspace = true }
scale-info = { workspace = true }

# Substrate
frame-support = { workspace = true }
frame-system = { workspace = true }
sp-core = { workspace = true }
sp-consensus-beefy = { workspace = true }
sp-runtime = { workspace = true }
sp-std = { workspace = true }
sp-io = { workspace = true }

# Cumulus
cumulus-primitives-core = { workspace = true }
cumulus-primitives-xcmp-mmd = { workspace = true }
cumulus-pallet-parachain-system = { workspace = true }

# Polkadot
polkadot-parachain-primitives = { workspace = true }
polkadot-primitives = { workspace = true }

# MMR
sp-mmr-primitives = { workspace = true }
pallet-mmr = { workspace = true }
binary-merkle-tree = { workspace = true }
mmr-lib = { workspace = true }

[dev-dependencies]
sp-io = { workspace = true, default-features = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"cumulus-pallet-parachain-system/std",
	"cumulus-primitives-core/std",
	"cumulus-primitives-xcmp-mmd/std",
	"frame-support/std",
	"frame-system/std",
	"log/std",
	"polkadot-parachain-primitives/std",
	"polkadot-primitives/std",
	"scale-info/std",
	"sp-core/std",
	"sp-consensus-beefy/std",
	"sp-io/std",
	"sp-mmr-primitives/std",
	"sp-runtime/std",
	"sp-std/std",
	"binary-merkle-tree/std",
	"mmr-lib/std",
	"pallet-mmr/std",
]
runtime-benchmarks = [
	"cumulus-pallet-parachain-system/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"polkadot-primitives/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
]
try-runtime = [
	"cumulus-pallet-parachain-system/try-runtime",
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"sp-runtime/try-runtime",
]
